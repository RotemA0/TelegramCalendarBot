name: Telegram Poll

# Stands in for the old webhook: since there's no always-on server, this checks Telegram
# every 5 minutes for new messages and creates calendar events from them.
on:
  schedule:
    # re-touched to force GitHub to re-register the schedule after it failed to fire
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Decode service account key
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > service-account.json

      - name: Poll Telegram for new messages
        env:
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          Google__CalendarId: ${{ secrets.GOOGLE_CALENDAR_ID }}
          Google__ServiceAccountKeyPath: service-account.json
        run: dotnet run --configuration Release -- poll

      - name: Clean up key file
        if: always()
        run: rm -f service-account.json

      - name: Persist offset state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update telegram poll offset [skip ci]"
          git push

      # GitHub's native `schedule:` trigger above is kept as a free extra layer, but it has
      # been observed to simply never fire for a brand-new repo (a known, documented platform
      # quirk — see community discussions on "scheduled workflow never triggers on a brand-new
      # repo"). This makes the 5-minute cadence self-sufficient regardless: every run
      # re-triggers the next one itself, so once started, it keeps going even if the native
      # schedule never activates. if: always() so a failure above still keeps the chain alive.
      - name: Schedule next poll
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          gh workflow run telegram-poll.yml --ref ${{ github.ref_name }}
